name: Type check

# Fast per-push feedback: type-check the app under the course's strict
# settings. Runs on every push; the project references (tsconfig.app /
# tsconfig.node) scope this to the student's src.
on: push

jobs:
    typecheck:
        runs-on: ubuntu-latest
        steps:
            - name: Check out the repository
              uses: actions/checkout@v4

            - name: Set up Node 22
              uses: actions/setup-node@v4
              with:
                  node-version: 22

            - name: Install dependencies
              run: npm ci

            - name: Type-check the app
              run: npm run typecheck
