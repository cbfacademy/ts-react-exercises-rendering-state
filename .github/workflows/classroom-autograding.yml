name: Classroom Autograding

# Full grading pipeline for this exercise's student forks: run the Vitest +
# React Testing Library suite, score functionality from the results, run AI
# code-quality review, update Airtable, and post feedback. The guard
# conditions live inside the reusable workflow, so this caller stays minimal
# and is a no-op on the template repo and on forks outside the classroom org.
#
# The React sessions share the same `node` toolchain as the plain-TypeScript
# ones: `npm ci` + `npm test`, where Vitest writes JUnit XML.
on:
    push:
        branches:
            - main

jobs:
    autograding:
        uses: cbfacademy/autograding-workflows/.github/workflows/classroom-autograding.yml@main
        with:
            toolchain: node
            test_report_glob: 'test-results/junit.xml'
            reporter: jest-junit
        secrets: inherit
